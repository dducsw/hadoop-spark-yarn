networks:
  bigdata-net:
    name: bigdata-net
    driver: bridge

services:

  # 1. ZooKeeper Coordinator
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    hostname: zookeeper
    networks: [bigdata-net]
    environment:
      ZOO_MY_ID: 1
    ports:
      - "2181:2181"
    volumes:
      - zk_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 512M
    restart: unless-stopped

  # 2. Relational Database (PostgreSQL 15 - Hive Metastore & Source OLTP/CRM)
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    hostname: postgres
    networks:
      bigdata-net:
        aliases:
          - postgres
          - hive-db
          - airflow-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
    ports:
      - "5433:5432"
    volumes:
      - hive_db_data:/var/lib/postgresql/data
      - ./scripts/bootstrap/init-postgres-dbs.sql:/docker-entrypoint-initdb.d/init-postgres-dbs.sql:ro
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. ClickHouse OLAP Engine
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.3-alpine}
    container_name: clickhouse
    hostname: clickhouse
    networks: [bigdata-net]
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP REST / Web Interface
      - "9004:9000"   # Native TCP Protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Master Node (HDFS NameNode, YARN RM, Hive Metastore, HiveServer2, Spark History)
  master:
    build:
      context: .
      dockerfile: docker/base/Dockerfile
    container_name: master
    hostname: master
    networks: [bigdata-net]
    ports:
      - "9870:9870"   # HDFS NameNode Web UI
      - "9000:9000"   # HDFS NameNode RPC
      - "8088:8088"   # YARN ResourceManager Web UI
      - "8032:8032"   # YARN RM ApplicationMaster RPC
      - "19888:19888" # MapReduce JobHistory Web UI
      - "18080:18080" # Spark History Server Web UI
      - "10000:10000" # Hive JDBC/ODBC (Beeline/BI)
      - "10002:10002" # HiveServer2 Web UI
      - "9083:9083"   # Hive Metastore Thrift RPC
      - "8888:8888"   # JupyterLab Web UI (PySpark on YARN)
    depends_on:
      zookeeper:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - master_name_data:/hadoop/dfs/name
      - ./scripts:/scripts
      - ./data:/data
      - ./pipeline:/pipeline
      - ./notebooks:/notebooks
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3584M
    command: /scripts/bootstrap/start-master.sh
    restart: unless-stopped

  # 5. Worker 1 (HDFS DataNode + YARN NodeManager)
  worker1:
    build:
      context: .
      dockerfile: docker/base/Dockerfile
    container_name: worker1
    hostname: worker1
    networks: [bigdata-net]
    depends_on:
      - master
    volumes:
      - worker1_dn_data:/hadoop/dfs/data
      - ./scripts:/scripts
      - ./data:/data
      - ./pipeline:/pipeline
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2250M
    command: /scripts/bootstrap/start-worker.sh
    restart: unless-stopped

  # 6. Worker 2 (HDFS DataNode + YARN NodeManager)
  worker2:
    build:
      context: .
      dockerfile: docker/base/Dockerfile
    container_name: worker2
    hostname: worker2
    networks: [bigdata-net]
    depends_on:
      - master
    volumes:
      - worker2_dn_data:/hadoop/dfs/data
      - ./scripts:/scripts
      - ./data:/data
      - ./pipeline:/pipeline
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2250M
    command: /scripts/bootstrap/start-worker.sh
    restart: unless-stopped

  # 7. Airflow Database Init & Admin User Creation
  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.1}
    container_name: airflow-init
    networks: [bigdata-net]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./scripts:/opt/airflow/scripts
      - airflow_logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow sync-perm || true) &&
        (airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true)
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 8. Airflow Webserver / API Server (UI on port 8080)
  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.1}
    container_name: airflow-webserver
    hostname: airflow-webserver
    networks: [bigdata-net]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    ports:
      - "8080:8080"
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./scripts:/opt/airflow/scripts
      - airflow_logs:/opt/airflow/logs
    command: api-server -p 8080
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 1024M
    restart: unless-stopped

  # 9. Airflow Scheduler
  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.1}
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    networks: [bigdata-net]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./scripts:/opt/airflow/scripts
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 1024M
    restart: unless-stopped

  # 10. Airflow DAG Processor (Airflow 3 Architecture)
  airflow-dag-processor:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.1}
    container_name: airflow-dag-processor
    hostname: airflow-dag-processor
    networks: [bigdata-net]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./scripts:/opt/airflow/scripts
      - airflow_logs:/opt/airflow/logs
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

volumes:
  zk_data:
  hive_db_data:
  clickhouse_data:
  master_name_data:
  worker1_dn_data:
  worker2_dn_data:
  airflow_db_data:
  airflow_logs:
