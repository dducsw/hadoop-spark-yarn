# Spark on YARN & Hive Configuration

spark.master                     yarn
spark.submit.deployMode          client

# Unified Resource Policy (calibrated for 2048MB YARN NodeManager)
spark.driver.memory              1024m
spark.driver.cores               1
spark.executor.memory            1024m
spark.executor.cores             1
spark.executor.memoryOverhead    384m
spark.yarn.maxAppAttempts        1

# Adaptive Query Execution (AQE) - dynamic shuffle partitioning
spark.sql.adaptive.enabled                       true
spark.sql.adaptive.coalescePartitions.enabled    true
spark.sql.sources.partitionOverwriteMode         dynamic

# Event Log & Spark History
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://master:9000/spark-logs
spark.history.fs.logDirectory    hdfs://master:9000/spark-logs
spark.yarn.historyServer.address master:18080

# Uploaded Jars
spark.yarn.jars                  hdfs://master:9000/spark-jars/*

# Hive Warehouse Location
spark.sql.warehouse.dir          hdfs://master:9000/user/hive/warehouse
spark.sql.catalogImplementation  hive
